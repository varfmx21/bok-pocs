<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <title>Dashboard</title>
</head>
<body>

    <div class="container user-dashboard">
        <h1 class="word">Welcome, {{ session.username }}!</h1>

        {% if msg %}
            <div class="msg-success">{{ msg }}</div>
        {% endif %}

        <div class="account-card">
            <h3 class="card-title">User Information</h3>
            {% if account %}
            <div class="info-row">
                <span class="info-label">Username:</span>
                <span class="info-value">{{ account.username }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Email:</span>
                <span class="info-value">{{ account.email }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">National ID:</span>
                <span class="info-value">{{ account.national_id }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Phone:</span>
                <span class="info-value">{{ account.phone }}</span>
            </div>
            {% endif %}
        </div>

        <p class="bottom"><a class="btn-logout" href="{{ url_for('logout') }}">Logout</a></p>
    </div>

</body>
</html>
